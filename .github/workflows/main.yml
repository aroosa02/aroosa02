name: generate animated snake

on:
  schedule:
    - cron: "0 */12 * * *"   # regenerates every 12 hours
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: aroosa02
          outputs: |
            dist/pink-snake.svg?color_snake=%23FF69B4&color_dots=%23FFD1DC,%23FFC0CB,%23FF9EC4,%23FF69B4,%23D6336C

      - name: push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
